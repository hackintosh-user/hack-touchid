name: Preference pane prebuilt

# Rebuilds the System Settings preference pane and commits the result to
# shared/pane/build whenever its source, Info.plist or build script change
# on main. Nobody has to compile and commit the bundle by hand any more.
#
# The commit is made with GITHUB_TOKEN, so it does not start another
# workflow run (no loop). It is skipped when the build output is identical.
# The pane version follows VERSION.txt at build time (the bump workflow
# changes the pane version on the next pane build, the source hash is
# unaffected by version bumps).

on:
  push:
    branches: [main]
    paths:
      - "shared/pane/source/HackTouchIDPane.swift"
      - "shared/pane/source/Info.plist"
      - "shared/pane/source/build_prefpane.sh"
      - "Hackintosh-TouchID-Menubar/Assets/AppIcon.iconset/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pane-prebuilt
  cancel-in-progress: false

jobs:
  build-and-commit:
    name: Build and commit the prebuilt pane (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build
        run: |
          bash shared/pane/source/build_prefpane.sh
      - name: Verify pane bundle was produced
        run: |
          PANE="shared/pane/build/HackTouchID.prefPane"
          test -x "$PANE/Contents/MacOS/HackTouchID"
          test -f "$PANE/Contents/Info.plist"
          EXPECTED="$(bash shared/pane/source/build_prefpane.sh --source-hash)"
          ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :HTIDPaneSourceHash' "$PANE/Contents/Info.plist")"
          echo "source hash expected=$EXPECTED actual=$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
      - name: Commit the prebuilt pane
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shared/pane/build
          if git diff --cached --quiet; then
            echo "Prebuilt pane already up to date."
            exit 0
          fi
          git commit -m "Preference pane: rebuild prebuilt pane (CI)" \
            -m "Built from ${GITHUB_SHA} by the pane-build workflow."
          git pull --rebase --autostash origin main
          git push origin HEAD:main
